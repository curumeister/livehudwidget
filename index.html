<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Clima 7 Cidades - Casio Digital (Dia/Noite)</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      font-size: 24px;
    }

    .weather-widget {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      border: 1px solid #3A3A3A;
      border-radius: 2px;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.8), inset 0 0 2px rgba(0, 0, 0, 0.5);
      transition: all 0.4s ease;
      opacity: 1;
      width: 320px;                   /* Largura levemente maior para comportar nomes como Rio Branco */
      justify-content: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
    }

    /* MODO DIA */
    .weather-widget.daytime {
      background-color: #1a1f1a;
      color: #C7FFA0;
      border-color: #4A5A4A;
      background-image: radial-gradient(circle at center, rgba(199, 255, 160, 0.06) 0.5px, transparent 0.5px);
      background-size: 4px 4px;
    }
    .daytime .weather-icon {
      filter: drop-shadow(0 0 2px rgba(199, 255, 160, 0.4));
    }
    .daytime .temperature {
      color: #C7FFA0;
      text-shadow: 0 0 6px rgba(199, 255, 160, 0.4);
    }
    .daytime .city {
      color: #8BA88B;
      text-shadow: 0 0 2px rgba(139, 168, 139, 0.3);
    }

    /* MODO NOITE */
    .weather-widget.nighttime {
      background-color: #050805;
      color: #6BFF8E;
      border-color: #2A3A2A;
      background-image: radial-gradient(circle at center, rgba(107, 255, 142, 0.12) 0.5px, transparent 0.5px);
      background-size: 4px 4px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.9), inset 0 0 3px rgba(107, 255, 142, 0.1);
    }
    .nighttime .weather-icon {
      filter: drop-shadow(0 0 6px rgba(107, 255, 142, 0.7));
    }
    .nighttime .temperature {
      color: #6BFF8E;
      text-shadow: 0 0 10px rgba(107, 255, 142, 0.6);
    }
    .nighttime .city {
      color: #4A6A4A;
      text-shadow: 0 0 4px rgba(74, 106, 74, 0.5);
    }

    .weather-widget.loading {
      opacity: 0.7;
    }

    .weather-icon {
      font-size: 2.5rem;
      line-height: 1;
      width: 48px;
      text-align: center;
    }

    .weather-info {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
      width: 140px;                  /* Aumentei para dar espaço ao nome das cidades */
    }

    .temperature {
      font-size: 2.8rem;
      font-weight: 400;
      letter-spacing: -1px;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      min-width: 80px;
      line-height: 1;
    }

    .city {
      font-size: 0.9rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      white-space: nowrap;
      margin-top: 2px;
    }

    @media (max-width: 480px) {
      body { font-size: 18px; }
      .weather-widget { width: 280px; padding: 10px 20px; gap: 12px; }
      .weather-icon { font-size: 2rem; width: 40px; }
      .temperature { font-size: 2.2rem; min-width: 60px; }
      .city { font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="weather-widget loading" id="weatherWidget">
    <span class="weather-icon" id="weatherIcon">🌡️</span>
    <div class="weather-info">
      <span class="temperature" id="temperature">--°</span>
      <span class="city" id="city">Carregando...</span>
    </div>
  </div>

  <script>
    const API_KEY = '46f49c9551bea5305c63071f37f9622d';
    const CITIES = [
      { name: 'São Paulo',     lat: -23.5505, lon: -46.6333 },
      { name: 'Rio de Janeiro', lat: -22.9068, lon: -43.1729 },
      { name: 'Belo Horizonte', lat: -19.9167, lon: -43.9345 },
      { name: 'Jales',         lat: -20.2672, lon: -50.5458 },
      { name: 'Rio Branco',    lat: -9.9749, lon: -67.8243 },
      { name: 'Recife',        lat: -8.0476, lon: -34.8770 }, // Representando Pernambuco
      { name: 'Salvador',      lat: -12.9714, lon: -38.5014 }
    ];
    const ROTATION_INTERVAL = 20000;

    const widget = document.getElementById('weatherWidget');
    const iconEl = document.getElementById('weatherIcon');
    const tempEl = document.getElementById('temperature');
    const cityEl = document.getElementById('city');

    let cachedData = {};
    let currentIndex = 0;
    let dataReady = false;

    function getEmoji(code, isDay) {
      if (code >= 200 && code < 300) return '⛈️';
      if (code >= 300 && code < 400) return '🌦️';
      if (code >= 500 && code < 600) return '🌧️';
      if (code >= 600 && code < 700) return '❄️';
      if (code >= 700 && code < 800) return '🌫️';
      if (code === 800) return isDay ? '☀️' : '🌙';
      if (code === 801) return isDay ? '🌤️' : '☁️';
      if (code >= 802) return '☁️';
      return '🌡️';
    }

    async function fetchCity(city) {
      const url = `https://api.openweathermap.org/data/2.5/weather?lat=${city.lat}&lon=${city.lon}&appid=${API_KEY}&units=metric&lang=pt`;
      const res = await fetch(url);
      const data = await res.json();
      return {
        temp: Math.round(data.main.temp),
        code: data.weather[0].id,
        name: city.name,
        sunrise: data.sys.sunrise,
        sunset: data.sys.sunset
      };
    }

    function isDayTime(sunrise, sunset) {
      const now = Math.floor(Date.now() / 1000);
      return now >= sunrise && now < sunset;
    }

    async function loadAllCities() {
      try {
        const results = await Promise.all(CITIES.map(city => fetchCity(city)));
        results.forEach((data, i) => { cachedData[i] = data; });
        dataReady = true;

        widget.classList.remove('loading');
        displayCity(currentIndex);

        setInterval(rotateCity, ROTATION_INTERVAL);

        setInterval(async () => {
          const fresh = await Promise.all(CITIES.map(city => fetchCity(city)));
          fresh.forEach((data, i) => { cachedData[i] = data; });
          displayCity(currentIndex);
        }, 10 * 60 * 1000);

      } catch (err) {
        console.error('Falha ao carregar clima:', err);
        tempEl.textContent = '--°';
        iconEl.textContent = '⚠️';
        cityEl.textContent = 'Erro';
        widget.classList.remove('loading');
      }
    }

    function displayCity(index) {
      const data = cachedData[index];
      if (!data) return;

      const day = isDayTime(data.sunrise, data.sunset);

      tempEl.textContent = `${data.temp}°`;
      iconEl.textContent = getEmoji(data.code, day);
      cityEl.textContent = data.name;

      widget.classList.remove('daytime', 'nighttime');
      widget.classList.add(day ? 'daytime' : 'nighttime');
    }

    function rotateCity() {
      currentIndex = (currentIndex + 1) % CITIES.length;
      displayCity(currentIndex);
    }

    loadAllCities();
  </script>
</body>
</html>
