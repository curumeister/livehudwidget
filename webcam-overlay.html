<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Webcam Overlay - Glitch Suave (Canal + Cupom)</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Orbitron', monospace;
    }

    .overlay {
      position: relative;
      width: 640px;
      height: 360px;
      border: 3px solid #00ffff;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.8), inset 0 0 12px rgba(0, 255, 255, 0.3);
      background: transparent;
    }

    .overlay .border-inner {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      bottom: 6px;
      box-shadow: inset 0 0 18px rgba(0, 255, 255, 0.3), inset 0 0 6px rgba(0, 255, 255, 0.5);
      pointer-events: none;
      z-index: 3;
    }

    .info-bar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      height: 48px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8, 8, 12, 0.3);
      backdrop-filter: blur(4px);
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0, 255, 255, 0.5);
      font-family: 'Orbitron', monospace;
      font-weight: 600;
      letter-spacing: 0.5px;
      overflow: hidden;
    }

    .info-bar .message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .info-bar .message.active {
      opacity: 1;
    }

    /* Glitch apenas na saída */
    .glitch-out {
      animation: glitch-out 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes glitch-out {
      0% {
        transform: translate(0);
        text-shadow: -1px 0 #ff00c1, 1px 0 #00ffff;
        opacity: 1;
      }
      25% {
        transform: translate(-1px, 0.5px);
        text-shadow: -1px 0 #ff00c1, 1px 0 #00ffff;
      }
      50% {
        transform: translate(1px, -0.5px);
        text-shadow: 1px 0 #ff00c1, -1px 0 #00ffff;
        opacity: 0.9;
      }
      75% {
        transform: translate(-0.5px, 1px);
        text-shadow: -0.5px 0 #ff00c1, 0.5px 0 #00ffff;
      }
      100% {
        transform: translate(0);
        text-shadow: none;
        opacity: 0;
      }
    }

    /* Canal */
    .info-bar .channel {
      font-weight: 700;
      color: rgba(255, 255, 255, 0.95);
      font-size: 1.2rem;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .channel-highlight {
      background: linear-gradient(135deg, #00ffff, #0088ff, #00ffff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
      text-shadow: 0 0 6px rgba(0, 255, 255, 0.6);
    }

    .channel em {
      font-style: italic;
      font-weight: 500;
      color: #dddddd;
      margin: 0 2px;
    }

    /* Cupom - textos normais em branco */
    .coupon-message {
      font-weight: 700;
      font-size: 1.2rem;
      display: flex;
      align-items: baseline;
      gap: 5px;
      white-space: nowrap;
    }

    .coupon-text {
      color: #f0f0f0;
      font-weight: 500;
    }

    .cupom-highlight {
      font-style: italic;
      font-weight: 900;
      color: #bfff00;
      -webkit-text-fill-color: #bfff00;
      text-shadow: 0 0 8px #bfff00;
      animation: pulsarVerde 2s ease-in-out infinite alternate;
    }

    .tradeit-highlight {
      font-weight: 800;
      color: #00c8ff;
      -webkit-text-fill-color: #00c8ff;
      text-shadow: 0 0 6px #00a6ff;
    }

    @keyframes pulsarVerde {
      0% { text-shadow: 0 0 4px #bfff00; }
      100% { text-shadow: 0 0 14px #eaff00, 0 0 18px #caff00; }
    }

    @media (max-width: 580px) {
      .info-bar .channel,
      .coupon-message {
        font-size: 1rem;
      }
      .info-bar {
        height: 42px;
      }
    }
  </style>
</head>
<body>
<div class="overlay">
  <div class="border-inner"></div>
  <div class="info-bar">
    <div class="message active" id="channelMessage">
      <span class="channel">opiordocs <em>by</em> <span class="channel-highlight">curumeister</span></span>
    </div>
    <div class="message" id="couponMessage">
      <span class="coupon-message">
        <span class="coupon-text">cupom:</span>
        <span class="cupom-highlight">CURU</span>
        <span class="coupon-text">na</span>
        <span class="tradeit-highlight">TRADEIT.GG</span>
      </span>
    </div>
  </div>
</div>

<script>
  (function() {
    const channelDiv = document.getElementById('channelMessage');
    const couponDiv = document.getElementById('couponMessage');
    
    const DURATIONS = {
      channel: 45000,
      coupon: 15000
    };

    const order = ['channel', 'coupon'];
    let currentIndex = 0;
    let timeoutId = null;
    let isAnimating = false;

    function applyGlitchOut(element, callback) {
      if (!element) return;
      element.classList.add('glitch-out');
      setTimeout(() => {
        element.classList.remove('glitch-out');
        if (callback) callback();
      }, 200);
    }

    function setActiveMessage(type) {
      const previousActive = document.querySelector('.info-bar .message.active');
      const newActive = type === 'channel' ? channelDiv : couponDiv;
      
      if (!newActive) return;
      if (isAnimating) return;
      
      if (previousActive && previousActive !== newActive) {
        isAnimating = true;
        applyGlitchOut(previousActive, () => {
          previousActive.classList.remove('active');
          newActive.classList.add('active');
          isAnimating = false;
        });
      } else if (!previousActive) {
        newActive.classList.add('active');
      }
    }

    function nextMessage() {
      const currentType = order[currentIndex];
      setActiveMessage(currentType);
      const duration = DURATIONS[currentType];
      currentIndex = (currentIndex + 1) % order.length;
      timeoutId = setTimeout(nextMessage, duration);
    }

    if (timeoutId) clearTimeout(timeoutId);
    nextMessage();
  })();
</script>
</body>
</html>
