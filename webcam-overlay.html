<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Webcam Overlay - Cupom 25% (Contorno Preto)</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Orbitron', monospace;
    }

    .overlay {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 5px solid #B8860B;
      border-radius: 0;
      box-shadow: 0 0 28px rgba(184, 134, 11, 0.85), inset 0 0 16px rgba(218, 165, 32, 0.35);
      background: transparent;
      overflow: visible;
    }

    .overlay .border-inner {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border-radius: 0;
      box-shadow: inset 0 0 22px rgba(218, 165, 32, 0.5), inset 0 0 8px rgba(184, 134, 11, 0.7);
      pointer-events: none;
      z-index: 3;
    }

    /* BARRA DE CUPOM */
    .info-bar {
      position: absolute;
      top: 16px;
      left: 18px;
      right: 18px;
      min-height: 52px;
      height: auto;
      padding: 10px 14px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(5px);
      border-radius: 0;
      font-family: 'Orbitron', monospace;
      font-weight: 600;
      letter-spacing: 0.5px;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      box-shadow: 0 0 0 2px #B8860B, 0 0 22px 6px rgba(184, 134, 11, 0.8), inset 0 0 16px rgba(218, 165, 32, 0.35);
      border: 1px solid #DAA520;
    }

    .info-bar.visible {
      opacity: 1;
      visibility: visible;
    }

    .coupon-message {
      font-weight: 700;
      font-size: 1.3rem;
      display: flex;
      align-items: baseline;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      text-align: center;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
      white-space: normal;
    }

    /* Texto padrão com contorno preto */
    .coupon-text {
      color: #ffffff;
      font-weight: 500;
      text-shadow:
        -1px -1px 0 #000000,
         1px -1px 0 #000000,
        -1px  1px 0 #000000,
         1px  1px 0 #000000,
        0 0 6px rgba(255, 255, 255, 0.3);
    }

    .cupom-highlight {
      font-style: italic;
      font-weight: 900;
      color: #ffffff;
      text-shadow:
        -1px -1px 0 #000000,
         1px -1px 0 #000000,
        -1px  1px 0 #000000,
         1px  1px 0 #000000;
    }

    .tradeit-highlight {
      font-weight: 800;
      color: #ffffff;
      text-shadow:
        -1px -1px 0 #000000,
         1px -1px 0 #000000,
        -1px  1px 0 #000000,
         1px  1px 0 #000000;
    }

    @media (max-width: 580px) {
      .coupon-message { font-size: 1rem; }
      .info-bar { top: 14px; left: 14px; right: 14px; }
      .overlay { border-width: 4px; }
      .overlay .border-inner { top: 8px; left: 8px; right: 8px; bottom: 8px; }
    }
  </style>
</head>
<body>
<div class="overlay">
  <div class="border-inner"></div>
  <div class="info-bar" id="infoBar">
    <span class="coupon-message">
      <span class="coupon-text">cupom</span>
      <span class="cupom-highlight">CURU</span>
      <span class="coupon-text">na</span>
      <span class="tradeit-highlight">TRADEIT.GG</span>
      <span class="coupon-text">te dá até 25% de desconto</span>
    </span>
  </div>
</div>

<script>
  const bar = document.getElementById('infoBar');
  const DELAY_HIDE = 15000;
  const INITIAL_DELAY = 5000;
  const REPEAT_INTERVAL = 90000;

  function showBar() {
    bar.classList.add('visible');
    setTimeout(() => {
      bar.classList.remove('visible');
    }, DELAY_HIDE);
  }

  setTimeout(() => {
    showBar();
    setInterval(() => {
      showBar();
    }, DELAY_HIDE + REPEAT_INTERVAL);
  }, INITIAL_DELAY);
</script>
</body>
</html>
