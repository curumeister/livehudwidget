<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Webcam Overlay - Borda Grossa (8px)</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Orbitron', monospace;
    }

    .overlay {
      position: relative;
      width: 640px;
      height: 360px;
      border: 8px solid #ffffff;           /* borda mais grossa (antes 5px) */
      border-radius: 12px;                 /* cantos levemente maiores */
      box-shadow: 0 0 32px rgba(255, 255, 255, 0.9), inset 0 0 18px rgba(255, 255, 255, 0.4);
      background: transparent;
      overflow: visible;
    }

    .overlay .border-inner {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border-radius: 8px;
      box-shadow: inset 0 0 24px rgba(255, 255, 255, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.7);
      pointer-events: none;
      z-index: 3;
    }

    /* BARRA DE CUPOM (branca neon) */
    .info-bar {
      position: absolute;
      bottom: 16px;
      left: 18px;
      right: 18px;
      height: 52px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8, 8, 12, 0.3);
      backdrop-filter: blur(4px);
      border-radius: 12px;
      font-family: 'Orbitron', monospace;
      font-weight: 600;
      letter-spacing: 0.5px;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9), 0 0 26px 8px rgba(255, 255, 255, 0.85), inset 0 0 18px rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    .info-bar.visible {
      opacity: 1;
      visibility: visible;
    }

    .coupon-message {
      font-weight: 700;
      font-size: 1.3rem;
      display: flex;
      align-items: baseline;
      gap: 6px;
      white-space: nowrap;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    .coupon-text {
      color: #f0f0f0;
      font-weight: 500;
    }

    .cupom-highlight {
      font-style: italic;
      font-weight: 900;
      color: #bfff00;
      text-shadow: 0 0 14px #bfff00, 0 0 6px #bfff00;
      animation: pulsarVerde 2s ease-in-out infinite alternate;
    }

    .tradeit-highlight {
      font-weight: 800;
      color: #00c8ff;
      text-shadow: 0 0 12px #00c8ff, 0 0 6px #00c8ff;
    }

    @keyframes pulsarVerde {
      0% { text-shadow: 0 0 4px #bfff00; }
      100% { text-shadow: 0 0 20px #eaff00, 0 0 26px #caff00; }
    }

    @media (max-width: 580px) {
      .coupon-message { font-size: 1rem; }
      .info-bar { height: 46px; bottom: 14px; left: 14px; right: 14px; border-radius: 10px; }
      .overlay { border-width: 6px; border-radius: 10px; }
      .overlay .border-inner { top: 8px; left: 8px; right: 8px; bottom: 8px; border-radius: 6px; }
    }
  </style>
</head>
<body>
<div class="overlay">
  <div class="border-inner"></div>
  <div class="info-bar" id="infoBar">
    <span class="coupon-message">
      <span class="coupon-text">cupom:</span>
      <span class="cupom-highlight">CURU</span>
      <span class="coupon-text">na</span>
      <span class="tradeit-highlight">TRADEIT.GG</span>
    </span>
  </div>
</div>

<script>
  const bar = document.getElementById('infoBar');
  const DELAY_HIDE = 15000;
  const DELAY_SHOW = 120000;

  function showBar() {
    bar.classList.add('visible');
    setTimeout(() => {
      bar.classList.remove('visible');
    }, DELAY_HIDE);
  }

  setTimeout(() => {
    showBar();
    setInterval(() => {
      showBar();
    }, DELAY_HIDE + DELAY_SHOW);
  }, DELAY_SHOW);
</script>
</body>
</html>
