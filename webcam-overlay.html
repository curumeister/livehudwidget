<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Webcam Overlay - Cupom com Ciclo (Aparece/Some)</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Orbitron', monospace;
    }

    .overlay {
      position: relative;
      width: 640px;
      height: 360px;
      border: 3px solid #00ffff;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.8), inset 0 0 12px rgba(0, 255, 255, 0.3);
      background: transparent;
    }

    .overlay .border-inner {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      bottom: 6px;
      box-shadow: inset 0 0 18px rgba(0, 255, 255, 0.3), inset 0 0 6px rgba(0, 255, 255, 0.5);
      pointer-events: none;
      z-index: 3;
    }

    /* BARRA INFERIOR - inicialmente oculta */
    .info-bar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      height: 48px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8, 8, 12, 0.3);
      backdrop-filter: blur(4px);
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0, 255, 255, 0.5);
      font-family: 'Orbitron', monospace;
      font-weight: 600;
      letter-spacing: 0.5px;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .info-bar.visible {
      opacity: 1;
      visibility: visible;
    }

    .coupon-message {
      font-weight: 700;
      font-size: 1.2rem;
      display: flex;
      align-items: baseline;
      gap: 5px;
      white-space: nowrap;
    }

    .coupon-text {
      color: #f0f0f0;
      font-weight: 500;
    }

    .cupom-highlight {
      font-style: italic;
      font-weight: 900;
      color: #bfff00;
      -webkit-text-fill-color: #bfff00;
      text-shadow: 0 0 8px #bfff00;
      animation: pulsarVerde 2s ease-in-out infinite alternate;
    }

    .tradeit-highlight {
      font-weight: 800;
      color: #00c8ff;
      -webkit-text-fill-color: #00c8ff;
      text-shadow: 0 0 6px #00a6ff;
    }

    @keyframes pulsarVerde {
      0% { text-shadow: 0 0 4px #bfff00; }
      100% { text-shadow: 0 0 14px #eaff00, 0 0 18px #caff00; }
    }

    @media (max-width: 580px) {
      .coupon-message {
        font-size: 1rem;
      }
      .info-bar {
        height: 42px;
      }
    }
  </style>
</head>
<body>
<div class="overlay">
  <div class="border-inner"></div>
  <div class="info-bar" id="infoBar">
    <span class="coupon-message">
      <span class="coupon-text">cupom:</span>
      <span class="cupom-highlight">CURU</span>
      <span class="coupon-text">na</span>
      <span class="tradeit-highlight">TRADEIT.GG</span>
    </span>
  </div>
</div>

<script>
  const bar = document.getElementById('infoBar');
  
  const DELAY_HIDE = 15000;      // 15 segundos visível
  const DELAY_SHOW = 120000;      // 2 minutos (120000 ms) entre aparições

  function showBar() {
    bar.classList.add('visible');
    // Após 15 segundos, esconde
    setTimeout(() => {
      bar.classList.remove('visible');
    }, DELAY_HIDE);
  }

  // Primeira aparição após 2 minutos
  setTimeout(() => {
    showBar();
    // A partir daí, repete o ciclo a cada 2 minutos + tempo de visibilidade? 
    // Para que o ciclo seja: desaparece, depois 2 minutos, aparece novamente.
    // Precisamos agendar a próxima aparição após o fim do tempo de exibição + 2 minutos.
    setInterval(() => {
      showBar();
    }, DELAY_HIDE + DELAY_SHOW); // 15s + 120s = 135s entre inícios de cada exibição
  }, DELAY_SHOW); // primeira espera de 2 minutos
</script>
</body>
</html>
