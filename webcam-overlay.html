<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Webcam Overlay - Luz RGB Atrás (Vazando para Baixo)</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Orbitron', monospace;
    }

    .overlay {
      position: relative;
      width: 640px;
      height: 360px;
      border: 3px solid #ffffff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.8), inset 0 0 12px rgba(255, 255, 255, 0.3);
      background: transparent;
      /* Garante que o conteúdo interno não corte a luz */
      overflow: visible;
    }

    .overlay .border-inner {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      bottom: 6px;
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.3), inset 0 0 6px rgba(255, 255, 255, 0.5);
      pointer-events: none;
      z-index: 3;
    }

    /* LUZ RGB - posicionada atrás da sobreposição, vazando apenas para baixo */
    .rgb-bottom {
      position: absolute;
      bottom: -6px;          /* ligeiramente abaixo da borda externa */
      left: 0;
      width: 100%;
      height: 6px;           /* linha fina */
      background: linear-gradient(90deg, 
        #ff0000, #ff00ff, #0000ff, #00ffff, #00ff00, #ffff00, #ff0000);
      background-size: 400% 100%;
      animation: rgbMove 6s linear infinite; /* mais lento (6s) */
      filter: blur(2px);     /* desfoque suave para simular luz espalhada */
      opacity: 0.9;
      z-index: 1;            /* atrás da barra de cupom (z-index 10) e da moldura */
      pointer-events: none;
      border-radius: 0 0 10px 10px;
    }

    /* Remove qualquer efeito que suba para cima */
    .rgb-bottom::after {
      display: none;
    }

    @keyframes rgbMove {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* BARRA DE CUPOM (branca neon) - fica na frente */
    .info-bar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      height: 48px;
      z-index: 10;          /* fica na frente da luz RGB */
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8, 8, 12, 0.3);
      backdrop-filter: blur(4px);
      border-radius: 8px;
      font-family: 'Orbitron', monospace;
      font-weight: 600;
      letter-spacing: 0.5px;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9), 0 0 20px 5px rgba(255, 255, 255, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .info-bar.visible {
      opacity: 1;
      visibility: visible;
    }

    .coupon-message {
      font-weight: 700;
      font-size: 1.2rem;
      display: flex;
      align-items: baseline;
      gap: 5px;
      white-space: nowrap;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
    }

    .coupon-text {
      color: #f0f0f0;
      font-weight: 500;
    }

    .cupom-highlight {
      font-style: italic;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 12px #ffffff, 0 0 4px #ffffff;
      animation: pulsarBranco 2s ease-in-out infinite alternate;
    }

    .tradeit-highlight {
      font-weight: 800;
      color: #e0e0ff;
      text-shadow: 0 0 10px #ffffff, 0 0 4px #ffffff;
    }

    @keyframes pulsarBranco {
      0% { text-shadow: 0 0 4px #ffffff; }
      100% { text-shadow: 0 0 18px #ffffff, 0 0 22px #ffffff; }
    }

    @media (max-width: 580px) {
      .coupon-message { font-size: 1rem; }
      .info-bar { height: 42px; }
      .rgb-bottom { height: 4px; bottom: -4px; }
    }
  </style>
</head>
<body>
<div class="overlay">
  <div class="border-inner"></div>
  <!-- Luz RGB atrás, vazando só para baixo -->
  <div class="rgb-bottom"></div>
  <!-- Barra de cupom na frente -->
  <div class="info-bar" id="infoBar">
    <span class="coupon-message">
      <span class="coupon-text">cupom:</span>
      <span class="cupom-highlight">CURU</span>
      <span class="coupon-text">na</span>
      <span class="tradeit-highlight">TRADEIT.GG</span>
    </span>
  </div>
</div>

<script>
  const bar = document.getElementById('infoBar');
  const DELAY_HIDE = 15000;
  const DELAY_SHOW = 120000;

  function showBar() {
    bar.classList.add('visible');
    setTimeout(() => {
      bar.classList.remove('visible');
    }, DELAY_HIDE);
  }

  setTimeout(() => {
    showBar();
    setInterval(() => {
      showBar();
    }, DELAY_HIDE + DELAY_SHOW);
  }, DELAY_SHOW);
</script>
</body>
</html>
